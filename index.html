<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINAAAA - Nuit Chinoise aux Lanternes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #050b12; /* Encore plus sombre pour faire ressortir les lanternes */
            color: #d6cdbb;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* --- LANTERNES ANIMÉES --- */
        .lantern-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .lantern {
            position: absolute;
            width: 40px;
            height: 55px;
            background: rgba(255, 77, 77, 0.15); /* Rouge transparent */
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.2), inset 0 0 15px rgba(255, 200, 50, 0.1);
            animation: float 20s infinite ease-in-out;
        }

        .lantern::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 5px;
            background: rgba(212, 175, 55, 0.3);
            border-radius: 2px;
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 10px;
            background: rgba(212, 175, 55, 0.2);
        }

        @keyframes float {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            50% { transform: translateY(50vh) translateX(20px) rotate(5deg); }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) translateX(-20px) rotate(-5deg); opacity: 0; }
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(5, 11, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding: 1rem 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 1.8rem;
            color: #ff4d4d;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }

        .header-info {
            font-size: 0.9rem;
            color: #d4af37;
            font-weight: 600;
        }

        /* --- HERO --- */
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(5, 11, 18, 0.3), rgba(5, 11, 18, 0.6)), url('https://i.ibb.co/p6RjypTH/jennifer-chen-Pnc2-Uxb7-PG0-unsplash.jpg') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            margin-top: 60px;
            position: relative;
            z-index: 1;
        }

        .hero-content h2 {
            font-size: 6rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.9);
            letter-spacing: 8px;
            font-weight: 700;
            color: #ff4d4d;
        }

        /* --- CONTENU --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .map-section {
            background: #0d1a29;
            padding: 1rem;
            margin: 2rem 0;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), 0 0 0 2px rgba(212, 175, 55, 0.15) inset;
            overflow: hidden;
            position: relative;
        }

        .map-section h2 {
            text-align: center;
            color: #d4af37;
            margin: 1.5rem 0;
            font-size: 2rem;
        }

        #map {
            width: 100%;
            height: 700px;
            background: #142c42;
            border-radius: 2rem;
        }

        .legende {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(5, 11, 18, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px 25px;
            border-radius: 60px;
            border-left: 3px solid #d4af37;
            color: #d6cdbb;
            font-size: 0.85rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
        }

        .section-title h2 {
            text-align: center;
            font-size: 2.5rem;
            color: #ff4d4d;
            margin: 3rem 0;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.3);
        }

        .destinations {
            display: grid;
            gap: 3rem;
        }

        .destination-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            background: rgba(13, 26, 41, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 1.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.1);
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        .destination-card:nth-child(even) { direction: rtl; }
        .destination-card > * { direction: ltr; }

        .destination-image {
            width: 100%;
            height: 350px;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .destination-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .destination-card:hover .destination-image img { transform: scale(1.1); }

        .destination-header-text h3 {
            font-size: 2.2rem;
            color: #d4af37;
            margin-bottom: 0.5rem;
        }

        .destination-number {
            width: 70px;
            height: 70px;
            background-color: #ff4d4d;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
        }

        .days-input input {
            width: 65px;
            padding: 0.5rem;
            background: #050b12;
            border: 1px solid #d4af37;
            border-radius: 0.5rem;
            color: #d4af37;
            text-align: center;
        }

        .transport-btn {
            padding: 0.6rem 1rem;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(5, 11, 18, 0.6);
            color: #d6cdbb;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .transport-btn.active {
            background-color: #d4af37;
            color: #050b12;
            font-weight: bold;
        }

        .activity-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.2rem;
            background-color: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 2rem;
            margin: 0 5px 5px 0;
        }

        .activity-tag button { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.2rem; }

        .add-activity input, .add-link input {
            padding: 0.6rem;
            background: #050b12;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 0.4rem;
            color: #d6cdbb;
            margin-right: 5px;
        }

        .add-activity button, .add-link button {
            padding: 0.6rem 1.2rem;
            background-color: #d4af37;
            color: #050b12;
            border: none;
            border-radius: 0.4rem;
            cursor: pointer;
            font-weight: 700;
        }

        .link-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.2rem;
            background-color: rgba(74, 124, 126, 0.15);
            border: 1px solid #4A7C7E;
            border-radius: 2rem;
            margin-right: 5px;
        }

        .link-tag a { color: #7ab8ba; text-decoration: none; }

        .divider {
            height: 2px;
            background: linear-gradient(to right, #ff4d4d, #d4af37, transparent);
            margin: 1.5rem 0;
        }

        footer {
            background-color: #020508;
            color: #d4af37;
            text-align: center;
            padding: 4rem;
            margin-top: 4rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
            z-index: 2;
        }

        .save-indicator {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background-color: #d4af37;
            color: #050b12;
            border-radius: 0.5rem;
            font-weight: bold;
            z-index: 2000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .hero-content h2 { font-size: 3.5rem; }
            .destination-card { grid-template-columns: 1fr; }
            #map { height: 500px; }
        }
    </style>
</head>
<body>
    <!-- LANTERNES EN ARRIÈRE-PLAN -->
    <div class="lantern-bg" id="lanternContainer"></div>

    <header>
        <div class="header-content">
            <h1>CHINAAAA</h1>
            <div class="header-info">
                <span id="totalDays">23</span> JOURS DE VOYAGE
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>CHINAAAA</h2>
        </div>
    </section>

    <div class="container">
        <div class="map-section">
            <h2>Votre route</h2>
            <div id="map"></div>
            <div class="legende">
                <span><i>🏙️</i> Shanghai</span>
                <span><i>🏔️</i> Zhangjiajie</span>
                <span><i>🌸</i> Furong</span>
                <span><i>🌉</i> Chongqing</span>
                <span><i>🐼</i> Chengdu</span>
                <span style="opacity:0.6; margin-left:4px;">⤵ itinéraire</span>
            </div>
        </div>
    </div>

    <div class="container">
        <section class="section-title">
            <h2>Itinéraire Céleste</h2>
        </section>

        <div class="destinations" id="destinationsContainer">
            <!-- Dynamique -->
        </div>
    </div>

    <footer>
        <p>🏮 Puisse votre chemin être éclairé par mille lanternes 🏮</p>
    </footer>

    <div class="save-indicator" id="saveIndicator" style="display:none;">Enregistré</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

        // Génération des lanternes
        const container = document.getElementById('lanternContainer');
        for (let i = 0; i < 15; i++) {
            const lantern = document.createElement('div');
            lantern.className = 'lantern';
            lantern.style.left = Math.random() * 100 + '%';
            lantern.style.animationDuration = (Math.random() * 15 + 15) + 's';
            lantern.style.animationDelay = (Math.random() * 20) + 's';
            lantern.style.opacity = Math.random() * 0.5 + 0.1;
            const size = Math.random() * 20 + 30;
            lantern.style.width = size + 'px';
            lantern.style.height = (size * 1.4) + 'px';
            container.appendChild(lantern);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyA9HSsYr_LCyAEpZS4zY9i69zQaG2zXNbw",
            authDomain: "chinaaaaa.firebaseapp.com",
            databaseURL: "https://chinaaaaa-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chinaaaaa",
            storageBucket: "chinaaaaa.firebasestorage.app",
            messagingSenderId: "663888608273",
            appId: "1:663888608273:web:3720af2baa1120673cc5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultDestinations = [
            { id: 'shanghai-1', city: 'Shanghai', days: 6, order: 1, image: 'https://i.ibb.co/TfCJSnJ/freeman-zhou-o-V9hp8w-Xk-PE-unsplash.jpg', lat: 31.2304, lng: 121.4737, activities: ['The Bund', 'Yu Garden', 'Jade Buddha Temple'], links: [], transport: 'Avion', icone: '🏙️' },
            { id: 'zhangjiajie', city: 'Zhangjiajie', days: 4, order: 2, image: 'https://i.ibb.co/G35bBvKc/alexander-schimmeck-ZOu-Iaoca-NDA-unsplash.jpg', lat: 29.3996, lng: 110.4848, activities: ['National Forest Park', 'Glass Skywalk', 'Bailong Elevator'], links: [], transport: 'Train', icone: '🏔️' },
            { id: 'furong', city: 'Furong', days: 1, order: 3, image: 'https://i.ibb.co/d4XXQhRJ/tao-yuan-7ak-Moq-Qk-AO0-unsplash.jpg', lat: 28.8433, lng: 109.9338, activities: ['Vieille ville', 'Marche local', 'Artisanat'], links: [], transport: 'Bus', icone: '🌸' },
            { id: 'chongqing', city: 'Chongqing', days: 4, order: 4, image: 'https://i.ibb.co/h12tnHRY/cling-yong-g-LNV8i-VCF9g-unsplash.jpg', lat: 29.5630, lng: 106.5516, activities: ['Hongya Cave', 'Yangtze River', 'Dazu Rock'], links: [], transport: 'Train', icone: '🌉' },
            { id: 'chengdu', city: 'Chengdu', days: 2, order: 5, image: 'https://i.ibb.co/NgpRQVdx/emma-lau-STSKtlrzz-YM-unsplash.jpg', lat: 30.5728, lng: 104.0668, activities: ['Panda Base', 'Wuhou Shrine', 'Jinli Street'], links: [], transport: 'Train', icone: '🐼' },
            { id: 'shanghai-2', city: 'Shanghai', days: 6, order: 6, image: 'https://i.ibb.co/TfCJSnJ/freeman-zhou-o-V9hp8w-Xk-PE-unsplash.jpg', lat: 31.2304, lng: 121.4737, activities: ['Shopping', 'Musees', 'Rooftop bars'], links: [], transport: 'Avion', icone: '🏙️' }
        ];

        const transportOptions = [
            { emoji: '🚂', label: 'Train' },
            { emoji: '✈️', label: 'Avion' },
            { emoji: '🚌', label: 'Bus' },
            { emoji: '🚗', label: 'Voiture' },
            { emoji: '🚶', label: 'A pied' }
        ];

        let destinations = [];
        let map = null;

        function initMap() {
            if (map) map.remove();
            map = L.map('map', { zoomControl: true }).setView([29.8, 108.5], 5.0);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', { attribution: '&copy; CartoDB' }).addTo(map);

            const sortedDests = [...destinations].sort((a, b) => a.order - b.order);
            sortedDests.forEach((dest) => {
                const icone = dest.icone || '📍';
                const html = `<div style="font-size: 2rem; background: rgba(10, 22, 38, 0.7); backdrop-filter: blur(2px); border-radius: 50%; padding: 5px; border: 1px solid #d4af37; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px #d4af37;">${icone}</div>`;
                const customIcon = L.divIcon({ html: html, className: '', iconSize: [45, 45], iconAnchor: [22, 22] });
                const marker = L.marker([dest.lat, dest.lng], { icon: customIcon }).addTo(map);
                marker.bindTooltip(dest.city, { direction: 'top', className: 'tooltip-ville', offset: [0, -15] });
            });

            if (sortedDests.length > 1) {
                const latlngs = sortedDests.map(d => [d.lat, d.lng]);
                L.polyline(latlngs, { color: '#d4af37', weight: 3, opacity: 0.6, dashArray: '10, 15' }).addTo(map);
            }
        }

        function loadDestinations() {
            onValue(ref(db, 'destinations'), (snapshot) => {
                if (snapshot.exists()) {
                    const rawData = Object.values(snapshot.val());
                    destinations = rawData.map(dest => {
                        const defaultDest = defaultDestinations.find(d => d.id === dest.id);
                        return { ...defaultDest, ...dest };
                    });
                } else {
                    destinations = JSON.parse(JSON.stringify(defaultDestinations));
                    saveAllDestinations();
                }
                renderDestinations();
                initMap();
            });
        }

        function renderDestinations() {
            const container = document.getElementById('destinationsContainer');
            container.innerHTML = '';

            destinations.sort((a, b) => a.order - b.order).forEach((dest, index) => {
                const ordinal = (index + 1) + (index === 0 ? 'er' : 'e');
                const card = document.createElement('div');
                card.className = 'destination-card';
                card.style.animationDelay = (index * 0.1) + 's';

                let activitiesHTML = (dest.activities || []).map((act, i) => 
                    `<span class="activity-tag">${act}<button onclick="removeActivity('${dest.id}', ${i})">×</button></span>`
                ).join('');

                let linksHTML = (dest.links || []).map((link, i) => 
                    `<span class="link-tag"><a href="${link}" target="_blank">Lien</a><button onclick="removeLink('${dest.id}', ${i})" style="background:none; border:none; color:#ff4d4d; margin-left:5px; cursor:pointer;">×</button></span>`
                ).join('');

                let transportHTML = transportOptions.map(opt => 
                    `<button class="transport-btn ${dest.transport === opt.label ? 'active' : ''}" onclick="updateTransport('${dest.id}', '${opt.label}')">${opt.emoji} ${opt.label}</button>`
                ).join('');

                card.innerHTML = `
                    <div class="destination-image"><img src="${dest.image}" alt="${dest.city}"></div>
                    <div class="destination-content">
                        <div class="destination-header">
                            <div class="destination-number">${ordinal}</div>
                            <div class="destination-header-text"><h3>${dest.city}</h3></div>
                        </div>
                        <div class="days-input">
                            <label>Durée :</label>
                            <input type="number" value="${dest.days}" onchange="updateDays('${dest.id}', parseInt(this.value))">
                            <span style="color:#d4af37; font-weight:bold;"> jours</span>
                        </div>
                        <div class="transport-selector">
                            <label>Transport</label>
                            <div class="transport-options">${transportHTML}</div>
                        </div>
                        <div class="activities">
                            <label>À visiter</label>
                            <div class="activity-list">${activitiesHTML}</div>
                            <div class="add-activity" style="display:flex;">
                                <input type="text" placeholder="Lieu..." id="in-act-${dest.id}">
                                <button onclick="addActivity('${dest.id}')">+</button>
                            </div>
                        </div>
                        <div class="links">
                            <label>Liens</label>
                            <div class="link-list">${linksHTML}</div>
                            <div class="add-link" style="display:flex;">
                                <input type="url" placeholder="Lien..." id="in-link-${dest.id}">
                                <button onclick="addLink('${dest.id}')">+</button>
                            </div>
                        </div>
                        <div class="divider"></div>
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById('totalDays').textContent = destinations.reduce((s, d) => s + d.days, 0);
        }

        window.updateDays = (id, val) => {
            const d = destinations.find(x => x.id === id);
            if (d) { d.days = val; set(ref(db, `destinations/${id}/days`), val); showSave(); renderDestinations(); }
        };

        window.updateTransport = (id, t) => {
            const d = destinations.find(x => x.id === id);
            if (d) { d.transport = t; set(ref(db, `destinations/${id}/transport`), t); showSave(); renderDestinations(); }
        };

        window.addActivity = (id) => {
            const input = document.getElementById(`in-act-${id}`);
            if (input.value.trim()) {
                const d = destinations.find(x => x.id === id);
                if (!d.activities) d.activities = [];
                d.activities.push(input.value.trim());
                set(ref(db, `destinations/${id}/activities`), d.activities);
                renderDestinations(); showSave();
            }
        };

        window.removeActivity = (id, idx) => {
            const d = destinations.find(x => x.id === id);
            d.activities.splice(idx, 1);
            set(ref(db, `destinations/${id}/activities`), d.activities);
            renderDestinations(); showSave();
        };

        window.addLink = (id) => {
            const input = document.getElementById(`in-link-${id}`);
            if (input.value.trim()) {
                const d = destinations.find(x => x.id === id);
                if (!d.links) d.links = [];
                d.links.push(input.value.trim());
                set(ref(db, `destinations/${id}/links`), d.links);
                renderDestinations(); showSave();
            }
        };

        window.removeLink = (id, idx) => {
            const d = destinations.find(x => x.id === id);
            d.links.splice(idx, 1);
            set(ref(db, `destinations/${id}/links`), d.links);
            renderDestinations(); showSave();
        };

        function saveAllDestinations() {
            const data = {}; destinations.forEach(d => data[d.id] = d);
            set(ref(db, 'destinations'), data);
        }

        function showSave() {
            const el = document.getElementById('saveIndicator');
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2000);
        }

        loadDestinations();
    </script>
</body>
</html>
