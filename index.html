<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINAAAA - Itinéraire Final</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        :root {
            --bg-deep: #0f1115;
            --bg-card: #1a1d23;
            --gold: #b89464;
            --gold-light: #d4cdc0;
            --red-imperial: #a62c2b;
            --text-main: #d1d1d1;
            --text-muted: #888;
            --link-blue: #4A7C7E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lato', sans-serif; background-color: var(--bg-deep); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Playfair Display', serif; }

        /* --- LANTERNES --- */
        .lantern-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .lantern { position: absolute; background: rgba(166, 44, 43, 0.08); border-radius: 8px; box-shadow: 0 0 15px rgba(166, 44, 43, 0.1); animation: floatUp 30s infinite linear; }
        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(15deg); opacity: 0; }
        }

        /* --- HEADER --- */
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 1500; background: rgba(15, 17, 21, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(184, 148, 100, 0.2); padding: 1.2rem 2rem; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .header-content h1 { font-size: 1.6rem; color: var(--red-imperial); letter-spacing: 4px; font-weight: 700; text-transform: uppercase; }
        .header-info { display: flex; gap: 20px; font-size: 0.85rem; color: var(--gold); font-weight: 600; letter-spacing: 1px; cursor: pointer; transition: 0.3s; padding: 5px 15px; border: 1px solid transparent; border-radius: 20px; }
        .header-info:hover { border-color: var(--gold); background: rgba(184, 148, 100, 0.1); }

        /* --- HERO --- */
        .hero { height: 60vh; background: linear-gradient(rgba(15, 17, 21, 0.2), rgba(15, 17, 21, 0.8)), url('https://i.ibb.co/p6RjypTH/jennifer-chen-Pnc2-Uxb7-PG0-unsplash.jpg') center/cover; display: flex; align-items: center; justify-content: center; text-align: center; margin-top: 60px; position: relative; z-index: 1; }
        .hero-content h2 { font-size: 5.5rem; color: var(--red-imperial); text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8); letter-spacing: 12px; font-weight: 700; }

        /* --- MAP SECTION --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; position: relative; z-index: 2; }
        .map-wrapper { background: var(--bg-card); padding: 1rem; margin: -60px 0 4rem; border-radius: 2rem; box-shadow: 0 30px 60px rgba(0,0,0,0.6); border: 1px solid rgba(184, 148, 100, 0.15); position: relative; }
        #map { width: 100%; height: 600px; border-radius: 1.5rem; background: #111; z-index: 5; }
        .custom-map-marker { display: flex !important; align-items: center; justify-content: center; background: rgba(15, 17, 21, 0.9) !important; backdrop-filter: blur(4px); border: 2px solid var(--gold) !important; border-radius: 50% !important; box-shadow: 0 0 15px rgba(184, 148, 100, 0.4); width: 50px !important; height: 50px !important; }
        .custom-map-marker span { font-size: 24px; color: white; }
        .legende { position: absolute; bottom: 25px; left: 25px; background: rgba(15, 17, 21, 0.9); padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(184, 148, 100, 0.3); display: flex; gap: 15px; font-size: 0.75rem; color: var(--gold-light); z-index: 1000; flex-wrap: wrap; }

        /* --- CALENDAR MODAL --- */
        #calendarModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.96); z-index: 2000; backdrop-filter: blur(15px); align-items: center; justify-content: center; padding: 20px; }
        .calendar-container { width: 100%; max-width: 1100px; background: #121212; border-radius: 1.5rem; border: 1px solid var(--gold); padding: 2rem; box-shadow: 0 50px 100px rgba(0,0,0,0.8); position: relative; max-height: 90vh; overflow-y: auto; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; color: #fff; flex-wrap: wrap; gap: 20px; }
        .calendar-header h2 { font-size: 2rem; color: var(--gold); letter-spacing: 3px; }
        .calendar-settings { display: flex; align-items: center; gap: 15px; color: var(--gold); font-weight: 700; font-size: 0.9rem; }
        .calendar-settings input { background: rgba(0,0,0,0.3); border: 1px solid var(--gold); color: var(--red-imperial); padding: 5px 10px; border-radius: 8px; width: 60px; text-align: center; font-weight: 700; font-size: 1rem; }
        .close-calendar { background: none; border: none; color: #fff; font-size: 2.5rem; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); position: relative; }
        .calendar-day-head { background: #1a1a1a; padding: 1rem; text-align: center; font-weight: 700; color: var(--gold); font-size: 0.8rem; text-transform: uppercase; }
        .calendar-cell { background: #121212; min-height: 100px; padding: 8px; position: relative; color: #555; font-size: 0.8rem; border-right: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .calendar-cell.current-month { color: #aaa; }
        .calendar-cell .day-number { position: absolute; top: 5px; right: 8px; font-weight: 700; }
        .calendar-bar { position: absolute; height: 26px; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 0.65rem; font-weight: 700; color: #fff; z-index: 10; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 6px rgba(0,0,0,0.4); pointer-events: none; }

        /* --- DESTINATIONS --- */
        .destinations { display: grid; gap: 4rem; padding-top: 2rem; padding-bottom: 2rem; }
        .destination-card { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; background: var(--bg-card); padding: 2.5rem; border-radius: 2rem; border: 1px solid rgba(184, 148, 100, 0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.4); align-items: start; position: relative; }
        .destination-card:nth-child(even) { direction: rtl; }
        .destination-card > * { direction: ltr; }
        .destination-image { width: 100%; height: 450px; border-radius: 1.5rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: sticky; top: 100px; background: #111; }
        .destination-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .destination-header { display: flex; align-items: center; gap: 20px; margin-bottom: 1.5rem; flex-wrap: nowrap; }
        .destination-number { flex-shrink: 0; width: 50px; height: 50px; background: var(--red-imperial); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; box-shadow: 0 0 15px rgba(166, 44, 43, 0.4); }
        .city-select { background: transparent; border: 1px solid rgba(184, 148, 100, 0.3); color: var(--gold); font-family: 'Playfair Display', serif; font-size: 2.2rem; border-radius: 8px; padding: 2px 10px; cursor: pointer; flex-grow: 1; max-width: 250px; }
        .city-select option { background: var(--bg-card); color: var(--gold); }
        
        .remove-step { background: rgba(166, 44, 43, 0.1); border: 1px solid var(--red-imperial); color: var(--red-imperial); padding: 8px 15px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.7rem; transition: 0.3s; flex-shrink: 0; }
        .remove-step:hover { background: var(--red-imperial); color: white; }

        .days-input { display: inline-flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 8px 15px; border-radius: 10px; margin-bottom: 1.5rem; color: var(--gold); font-weight: 600; }
        .days-input input { width: 45px; background: transparent; border: none; color: var(--red-imperial); font-weight: 700; font-size: 1.1rem; text-align: center; }
        
        .input-label { display: block; font-size: 0.8rem; color: var(--red-imperial); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
        .transport-btn { padding: 8px 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(184, 148, 100, 0.15); color: var(--text-main); border-radius: 8px; cursor: pointer; margin: 0 6px 6px 0; font-size: 0.85rem; transition: 0.2s; }
        .transport-btn.active { background: var(--gold); color: var(--bg-deep); border-color: var(--gold); font-weight: 600; }
        
        .item-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(184, 148, 100, 0.1); margin-bottom: 8px; }
        .item-main a { color: var(--link-blue); text-decoration: none; font-weight: 600; }
        .price-badge { background: rgba(184, 148, 100, 0.15); color: var(--gold); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }
        .remove-item { color: var(--red-imperial); background: none; border: none; cursor: pointer; font-size: 1.2rem; margin-left: 10px; }
        
        .add-group { display: grid; grid-template-columns: 1fr 80px 45px; gap: 8px; margin-bottom: 1.5rem; }
        .add-group input { background: rgba(0,0,0,0.2); border: 1px solid rgba(184, 148, 100, 0.2); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
        .add-group button { background: var(--gold); color: var(--bg-deep); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        .budget-summary { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(184, 148, 100, 0.1); text-align: right; color: var(--gold); font-weight: 700; font-size: 0.9rem; }
        
        .add-step-container { text-align: center; padding: 4rem 0 6rem; }
        .add-step-btn { background: transparent; border: 2px dashed var(--gold); color: var(--gold); padding: 18px 45px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.3s; }
        .add-step-btn:hover { background: rgba(184, 148, 100, 0.1); transform: scale(1.05); }

        footer { background: #080a0d; padding: 4rem; text-align: center; border-top: 1px solid rgba(184, 148, 100, 0.1); position: relative; z-index: 2; }
    </style>
</head>
<body>
    <div class="lantern-bg" id="lanterns"></div>
    <header>
        <div class="header-content">
            <h1>CHINAAAA</h1>
            <div class="header-info" id="openCalendar"><span><span id="totalDays">0</span> JOURS</span></div>
        </div>
    </header>

    <div id="calendarModal">
        <div class="calendar-container">
            <div class="calendar-header">
                <h2>Décembre 2026</h2>
                <div class="calendar-settings">
                    <span>DÉPART LE :</span>
                    <input type="number" id="startDateInput" min="1" max="31" value="1">
                    <span>DÉCEMBRE</span>
                </div>
                <button class="close-calendar" id="closeCalendar">×</button>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <div class="calendar-day-head">Lun</div><div class="calendar-day-head">Mar</div><div class="calendar-day-head">Mer</div>
                <div class="calendar-day-head">Jeu</div><div class="calendar-day-head">Ven</div><div class="calendar-day-head">Sam</div><div class="calendar-day-head">Dim</div>
            </div>
        </div>
    </div>

    <section class="hero"><div class="hero-content"><h2>CHINAAAA</h2></div></section>
    <div class="container">
        <div class="map-wrapper"><div id="map"></div><div class="legende" id="mapLegende"></div></div>
        <div class="destinations" id="destContainer"></div>
        <div class="add-step-container"><button class="add-step-btn" onclick="addStep()">+ AJOUTER UNE ÉTAPE</button></div>
    </div>
    <footer><p style="color: var(--gold); letter-spacing: 2px;">🏮 RABI M3ANA 🏮</p></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA9HSsYr_LCyAEpZS4zY9i69zQaG2zXNbw",
            authDomain: "chinaaaaa.firebaseapp.com",
            databaseURL: "https://chinaaaaa-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chinaaaaa",
            storageBucket: "chinaaaaa.firebasestorage.app",
            messagingSenderId: "663888608273",
            appId: "1:663888608273:web:3720af2baa1120673cc5b0"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const cityData = {
            'Shanghai': { lat: 31.2304, lng: 121.4737, icone: '🏙️', color: '#8b7355', image: 'https://i.ibb.co/TfCJSnJ/freeman-zhou-o-V9hp8w-Xk-PE-unsplash.jpg' },
            'Zhangjiajie': { lat: 29.3996, lng: 110.4848, icone: '🏔️', color: '#4e7c59', image: 'https://i.ibb.co/G35bBvKc/alexander-schimmeck-ZOu-Iaoca-NDA-unsplash.jpg' },
            'Furong': { lat: 28.8433, lng: 109.9338, icone: '🌸', color: '#5c5c5c', image: 'https://i.ibb.co/d4XXQhRJ/tao-yuan-7ak-Moq-Qk-AO0-unsplash.jpg' },
            'Chongqing': { lat: 29.5630, lng: 106.5516, icone: '🌉', color: '#3a5a78', image: 'https://i.ibb.co/h12tnHRY/cling-yong-g-LNV8i-VCF9g-unsplash.jpg' },
            'Chengdu': { lat: 30.5728, lng: 104.0668, icone: '🐼', color: '#999999', image: 'https://i.ibb.co/NgpRQVdx/emma-lau-STSKtlrzz-YM-unsplash.jpg' },
            'Pékin': { lat: 39.9042, lng: 116.4074, icone: '🐲', color: '#a62c2b', image: 'https://i.ibb.co/MybKmbQz/hanson-lu-8-EFj6-ISA08-unsplash.jpg' }
        };

        let destinations = [];
        let map = null;
        let mapLayers = L.layerGroup();
        let startDate = 1;

        // Lanterns
        const lContainer = document.getElementById('lanterns');
        for(let i=0; i<15; i++) {
            const l = document.createElement('div');
            l.className = 'lantern';
            l.style.left = Math.random()*100 + '%';
            l.style.width = (Math.random()*15 + 20) + 'px';
            l.style.height = (parseFloat(l.style.width)*1.4) + 'px';
            l.style.animationDelay = Math.random()*20 + 's';
            lContainer.appendChild(l);
        }

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([30, 110], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(map);
            mapLayers.addTo(map);
        }

        function updateMap() {
            if(!map) return;
            mapLayers.clearLayers();
            const coords = [];
            const sorted = [...destinations].sort((a,b) => a.order - b.order);
            sorted.forEach(d => {
                if(d.lat && d.lng) {
                    const marker = L.marker([d.lat, d.lng], { 
                        icon: L.divIcon({ className: 'custom-map-marker', html: `<span>${d.icone || '📍'}</span>`, iconSize: [50, 50], iconAnchor: [25, 25] }) 
                    }).addTo(mapLayers);
                    marker.bindTooltip(d.city);
                    coords.push([d.lat, d.lng]);
                }
            });
            if(coords.length > 1) {
                L.polyline(coords, { color: 'var(--gold)', weight: 2, opacity: 0.4, dashArray: '5, 10' }).addTo(mapLayers);
                map.fitBounds(L.latLngBounds(coords), { padding: [50, 50] });
            }
            document.getElementById('mapLegende').innerHTML = sorted.map(d => `<span>${d.icone || ''} ${d.city}</span>`).join('');
        }

        function load() {
            // Charger la date de départ
            onValue(ref(db, 'settings/startDate'), (snap) => {
                startDate = snap.exists() ? parseInt(snap.val()) : 1;
                document.getElementById('startDateInput').value = startDate;
                if(document.getElementById('calendarModal').style.display === 'flex') renderCalendar();
            });
            
            // Charger les destinations
            onValue(ref(db, 'destinations'), (snap) => {
                if(snap.exists()) {
                    destinations = Object.values(snap.val());
                } else {
                    destinations = [
                        { id: 'sh-1', city: 'Shanghai', days: 6, order: 0, ...cityData['Shanghai'], activities: [], links: [], transport: 'Avion' },
                        { id: 'zj-1', city: 'Zhangjiajie', days: 4, order: 1, ...cityData['Zhangjiajie'], activities: [], links: [], transport: 'Train' }
                    ];
                    destinations.forEach(d => set(ref(db, `destinations/${d.id}`), d));
                }
                render(); initMap(); updateMap();
                if(document.getElementById('calendarModal').style.display === 'flex') renderCalendar();
            });
        }

        function render() {
            const cont = document.getElementById('destContainer');
            cont.innerHTML = '';
            destinations.sort((a,b) => a.order - b.order).forEach((d, i) => {
                const card = document.createElement('div');
                card.className = 'destination-card';
                let budget = (d.activities || []).reduce((s, a) => s + (a.price || 0), 0) + (d.links || []).reduce((s, l) => s + (l.price || 0), 0);
                const actsHtml = (d.activities || []).map((a, idx) => `<div class="item-row"><div class="item-main"><span>${a.name}</span></div><div style="display:flex; align-items:center;">${a.price ? `<span class="price-badge">${a.price}€</span>` : ''}<button class="remove-item" onclick="removeItem('${d.id}', 'activities', ${idx})">×</button></div></div>`).join('');
                const linksHtml = (d.links || []).map((l, idx) => {
                    let domain = 'Lien'; try { domain = new URL(l.url).hostname.replace('www.', ''); } catch(e) {}
                    return `<div class="item-row"><div class="item-main"><a href="${l.url}" target="_blank">${domain}</a></div><div style="display:flex; align-items:center;">${l.price ? `<span class="price-badge">${l.price}€</span>` : ''}<button class="remove-item" onclick="removeItem('${d.id}', 'links', ${idx})">×</button></div></div>`;
                }).join('');
                const trans = ['Train', 'Avion', 'Bus'].map(t => `<button class="transport-btn ${d.transport === t ? 'active' : ''}" onclick="upTrans('${d.id}', '${t}')">${t}</button>`).join('');
                const cityOptions = Object.keys(cityData).map(c => `<option value="${c}" ${d.city === c ? 'selected' : ''}>${c}</option>`).join('');

                card.innerHTML = `
                    <div class="destination-image"><img src="${d.image}"></div>
                    <div class="destination-content">
                        <div class="destination-header">
                            <div class="destination-number">${i+1}</div>
                            <select class="city-select" onchange="upCity('${d.id}', this.value)">${cityOptions}</select>
                            <button class="remove-step" onclick="removeStep('${d.id}')">SUPPRIMER</button>
                        </div>
                        <div class="days-input"><input type="number" value="${d.days}" onchange="upDays('${d.id}', this.value)"> jours</div>
                        <div style="margin-bottom:2rem;"><span class="input-label">Transport</span><div>${trans}</div></div>
                        <div style="margin-bottom:2rem;"><span class="input-label">Activités</span><div class="item-list">${actsHtml}</div><div class="add-group"><input type="text" placeholder="Nom..." id="act-n-${d.id}"><input type="number" placeholder="€" id="act-p-${d.id}"><button onclick="addItem('${d.id}', 'activities')">+</button></div></div>
                        <div style="margin-bottom:1rem;"><span class="input-label">Liens</span><div class="item-list">${linksHtml}</div><div class="add-group"><input type="url" placeholder="Lien..." id="lnk-u-${d.id}"><input type="number" placeholder="€" id="lnk-p-${d.id}"><button onclick="addItem('${d.id}', 'links')">+</button></div></div>
                        <div class="budget-summary">Budget ${d.city}: ${budget}€</div>
                    </div>`;
                cont.appendChild(card);
            });
            document.getElementById('totalDays').textContent = destinations.reduce((s, d) => s + d.days, 0);
        }

        // CALENDRIER
        const modal = document.getElementById('calendarModal');
        document.getElementById('openCalendar').onclick = () => { 
            modal.style.display = 'flex';
            setTimeout(renderCalendar, 10); // Petit délai pour laisser le temps au CSS d'afficher le modal
        };
        document.getElementById('closeCalendar').onclick = () => modal.style.display = 'none';
        
        document.getElementById('startDateInput').onchange = (e) => {
            const val = parseInt(e.target.value);
            if(val >= 1 && val <= 31) {
                startDate = val;
                set(ref(db, 'settings/startDate'), val);
                renderCalendar();
            }
        };
        
        window.onclick = (e) => { if(e.target == modal) modal.style.display = 'none'; };

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;
            
            const heads = grid.querySelectorAll('.calendar-day-head');
            grid.innerHTML = ''; heads.forEach(h => grid.appendChild(h));
            
            // Décembre 2026 commence un Mardi (Index 1 si Lun=0)
            const offset = 1; 
            for(let i=0; i<offset; i++) grid.appendChild(document.createElement('div')).className = 'calendar-cell';
            
            for(let d=1; d<=31; d++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell current-month'; cell.id = `day-${d}`;
                cell.innerHTML = `<span class="day-number">${d}</span>`;
                grid.appendChild(cell);
            }

            let cur = startDate;
            const sorted = [...destinations].sort((a,b) => a.order - b.order);
            
            sorted.forEach(dest => {
                if(cur > 31) return;
                const start = cur; 
                const end = Math.min(31, cur + dest.days - 1);
                const color = dest.color || 'var(--gold)';
                let segStart = start;
                
                for(let d=start; d<=end; d++) {
                    if((d+offset)%7 === 0 || d === end) {
                        const bar = document.createElement('div'); 
                        bar.className = 'calendar-bar';
                        bar.style.backgroundColor = color; 
                        bar.style.opacity = '0.9';
                        
                        // TEXTE SANS EMOJI
                        if(segStart === start) bar.innerHTML = `${dest.city}`;
                        
                        const sCell = document.getElementById(`day-${segStart}`);
                        const eCell = document.getElementById(`day-${d}`);
                        
                        if(sCell && eCell) {
                            const sRect = sCell.getBoundingClientRect(); 
                            const eRect = eCell.getBoundingClientRect(); 
                            const gRect = grid.getBoundingClientRect();
                            
                            // On vérifie que les dimensions sont calculables
                            if (gRect.width > 0) {
                                bar.style.top = (sRect.top - gRect.top + 40) + 'px';
                                bar.style.left = (sRect.left - gRect.left + 5) + 'px';
                                bar.style.width = (eRect.right - sRect.left - 10) + 'px';
                                grid.appendChild(bar);
                            }
                        }
                        segStart = d + 1;
                    }
                }
                cur += dest.days;
            });
        }

        window.addStep = () => {
            const id = 'step-' + Date.now();
            const order = destinations.length > 0 ? Math.max(...destinations.map(d => d.order)) + 1 : 0;
            const newDest = { id, city: 'Shanghai', days: 2, order, ...cityData['Shanghai'], activities: [], links: [], transport: 'Train' };
            set(ref(db, `destinations/${id}`), newDest);
        };
        
        window.removeStep = (id) => { if(destinations.length > 1) remove(ref(db, `destinations/${id}`)); };
        
        window.upCity = (id, name) => {
            const data = cityData[name];
            Object.keys(data).forEach(k => set(ref(db, `destinations/${id}/${k}`), data[k]));
            set(ref(db, `destinations/${id}/city`), name);
        };
        
        window.upDays = (id, v) => set(ref(db, `destinations/${id}/days`), parseInt(v));
        window.upTrans = (id, t) => set(ref(db, `destinations/${id}/transport`), t);
        
        window.addItem = (id, type) => {
            const n = document.getElementById(type==='activities'?`act-n-${id}`:`lnk-u-${id}`);
            const p = document.getElementById(type==='activities'?`act-p-${id}`:`lnk-p-${id}`);
            if(!n.value.trim()) return;
            const d = destinations.find(x => x.id === id);
            const list = [...(d[type] || [])];
            list.push(type === 'activities' ? { name: n.value.trim(), price: parseFloat(p.value)||0 } : { url: n.value.trim(), price: parseFloat(p.value)||0 });
            set(ref(db, `destinations/${id}/${type}`), list);
            n.value = ''; p.value = '';
        };
        
        window.removeItem = (id, type, idx) => {
            const d = destinations.find(x => x.id === id);
            const list = [...d[type]]; list.splice(idx, 1);
            set(ref(db, `destinations/${id}/${type}`), list);
        };
        
        load();
    </script>
</body>
</html>
