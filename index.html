<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINAAAA - Itinéraire Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        :root {
            --bg-deep: #0f1115;
            --bg-card: #1a1d23;
            --gold: #b89464;
            --gold-light: #d4cdc0;
            --red-imperial: #a62c2b;
            --text-main: #d1d1d1;
            --text-muted: #888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }

        /* --- LANTERNES SUBTILES --- */
        .lantern-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .lantern {
            position: absolute;
            background: rgba(166, 44, 43, 0.1);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(166, 44, 43, 0.15);
            animation: floatUp 25s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) rotate(10deg); opacity: 0; }
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1100;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(184, 148, 100, 0.2);
            padding: 1.2rem 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 1.6rem;
            color: var(--red-imperial);
            letter-spacing: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .header-info {
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* --- HERO --- */
        .hero {
            height: 70vh;
            background: linear-gradient(rgba(15, 17, 21, 0.2), rgba(15, 17, 21, 0.8)), url('https://i.ibb.co/p6RjypTH/jennifer-chen-Pnc2-Uxb7-PG0-unsplash.jpg') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-top: 60px;
            position: relative;
            z-index: 1;
        }

        .hero-content h2 {
            font-size: 5.5rem;
            color: var(--red-imperial);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            letter-spacing: 12px;
            font-weight: 700;
        }

        /* --- MAP SECTION --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }

        .map-wrapper {
            background: var(--bg-card);
            padding: 1rem;
            margin: -80px 0 4rem;
            border-radius: 2rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(184, 148, 100, 0.15);
            position: relative;
        }

        #map {
            width: 100%;
            height: 650px;
            border-radius: 1.5rem;
            background: #111;
        }

        /* --- MAP ICONS FIX --- */
        .custom-map-marker {
            display: flex !important;
            align-items: center;
            justify-content: center;
            background: rgba(15, 17, 21, 0.8) !important;
            backdrop-filter: blur(4px);
            border: 2px solid var(--gold) !important;
            border-radius: 50% !important;
            box-shadow: 0 0 15px rgba(184, 148, 100, 0.4);
            width: 50px !important;
            height: 50px !important;
            transition: transform 0.3s ease;
        }

        .custom-map-marker span {
            font-size: 24px;
            line-height: 1;
            display: block;
        }

        .custom-map-marker:hover {
            transform: scale(1.15);
            border-color: #fff !important;
        }

        .legende {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(15, 17, 21, 0.9);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid rgba(184, 148, 100, 0.3);
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--gold-light);
            z-index: 1000;
        }

        /* --- DESTINATIONS --- */
        .section-title h2 {
            text-align: center;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 3rem;
            letter-spacing: 2px;
        }

        .destinations {
            display: grid;
            gap: 4rem;
            padding-bottom: 5rem;
        }

        .destination-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 2rem;
            border: 1px solid rgba(184, 148, 100, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            align-items: center;
        }

        .destination-card:nth-child(even) { direction: rtl; }
        .destination-card > * { direction: ltr; }

        .destination-image {
            width: 100%;
            height: 400px;
            border-radius: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .destination-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .destination-card:hover .destination-image img { transform: scale(1.05); }

        .destination-number {
            width: 60px;
            height: 60px;
            background: var(--red-imperial);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(166, 44, 43, 0.4);
        }

        .destination-content h3 {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .days-input {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 8px 15px;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }

        .days-input input {
            width: 50px;
            background: transparent;
            border: none;
            color: var(--red-imperial);
            font-weight: 700;
            font-size: 1.2rem;
            text-align: center;
        }

        .transport-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(184, 148, 100, 0.2);
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            margin: 0 8px 8px 0;
            transition: 0.3s;
        }

        .transport-btn.active {
            background: var(--gold);
            color: var(--bg-deep);
            border-color: var(--gold);
            font-weight: 600;
        }

        .activity-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            background: rgba(184, 148, 100, 0.1);
            border: 1px solid rgba(184, 148, 100, 0.3);
            border-radius: 50px;
            margin: 0 8px 8px 0;
            font-size: 0.85rem;
        }

        .activity-tag button {
            background: none;
            border: none;
            color: var(--red-imperial);
            margin-left: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .add-btn {
            background: var(--gold);
            color: var(--bg-deep);
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(184, 148, 100, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            margin-right: 8px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, var(--gold), transparent);
            margin: 2rem 0;
            opacity: 0.3;
        }

        footer {
            background: #080a0d;
            padding: 4rem;
            text-align: center;
            border-top: 1px solid rgba(184, 148, 100, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 992px) {
            .destination-card { grid-template-columns: 1fr; }
            .hero-content h2 { font-size: 3.5rem; }
        }
    </style>
</head>
<body>
    <div class="lantern-bg" id="lanterns"></div>

    <header>
        <div class="header-content">
            <h1>CHINAAAA</h1>
            <div class="header-info"><span id="totalDays">23</span> JOURS · ITINÉRAIRE</div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>CHINAAAA</h2>
        </div>
    </section>

    <div class="container">
        <div class="map-wrapper">
            <div id="map"></div>
            <div class="legende">
                <span>🏙️ Shanghai</span>
                <span>🏔️ Zhangjiajie</span>
                <span>🌸 Furong</span>
                <span>🌉 Chongqing</span>
                <span>🐼 Chengdu</span>
            </div>
        </div>

        <section class="section-title">
            <h2>L'Épopée Orientale</h2>
        </section>

        <div class="destinations" id="destContainer"></div>
    </div>

    <footer>
        <p style="color: var(--gold); letter-spacing: 2px;">🏮 BON VOYAGE 🏮</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

        // Lanterns
        const lContainer = document.getElementById('lanterns');
        for(let i=0; i<12; i++) {
            const l = document.createElement('div');
            l.className = 'lantern';
            l.style.left = Math.random()*100 + '%';
            l.style.width = (Math.random()*20 + 25) + 'px';
            l.style.height = (parseFloat(l.style.width)*1.4) + 'px';
            l.style.animationDelay = Math.random()*20 + 's';
            l.style.animationDuration = (Math.random()*10 + 20) + 's';
            lContainer.appendChild(l);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyA9HSsYr_LCyAEpZS4zY9i69zQaG2zXNbw",
            authDomain: "chinaaaaa.firebaseapp.com",
            databaseURL: "https://chinaaaaa-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chinaaaaa",
            storageBucket: "chinaaaaa.firebasestorage.app",
            messagingSenderId: "663888608273",
            appId: "1:663888608273:web:3720af2baa1120673cc5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultDests = [
            { id: 'shanghai-1', city: 'Shanghai', days: 6, order: 1, image: 'https://i.ibb.co/TfCJSnJ/freeman-zhou-o-V9hp8w-Xk-PE-unsplash.jpg', lat: 31.2304, lng: 121.4737, activities: ['The Bund', 'Yu Garden'], transport: 'Avion', icone: '🏙️' },
            { id: 'zhangjiajie', city: 'Zhangjiajie', days: 4, order: 2, image: 'https://i.ibb.co/G35bBvKc/alexander-schimmeck-ZOu-Iaoca-NDA-unsplash.jpg', lat: 29.3996, lng: 110.4848, activities: ['National Park'], transport: 'Train', icone: '🏔️' },
            { id: 'furong', city: 'Furong', days: 1, order: 3, image: 'https://i.ibb.co/d4XXQhRJ/tao-yuan-7ak-Moq-Qk-AO0-unsplash.jpg', lat: 28.8433, lng: 109.9338, activities: ['Cascade'], transport: 'Bus', icone: '🌸' },
            { id: 'chongqing', city: 'Chongqing', days: 4, order: 4, image: 'https://i.ibb.co/h12tnHRY/cling-yong-g-LNV8i-VCF9g-unsplash.jpg', lat: 29.5630, lng: 106.5516, activities: ['Hongya Cave'], transport: 'Train', icone: '🌉' },
            { id: 'chengdu', city: 'Chengdu', days: 2, order: 5, image: 'https://i.ibb.co/NgpRQVdx/emma-lau-STSKtlrzz-YM-unsplash.jpg', lat: 30.5728, lng: 104.0668, activities: ['Panda Base'], transport: 'Train', icone: '🐼' },
            { id: 'shanghai-2', city: 'Shanghai', days: 6, order: 6, image: 'https://i.ibb.co/TfCJSnJ/freeman-zhou-o-V9hp8w-Xk-PE-unsplash.jpg', lat: 31.2304, lng: 121.4737, activities: ['Shopping'], transport: 'Avion', icone: '🏙️' }
        ];

        let destinations = [];
        let map = null;

        function initMap() {
            if (map) map.remove();
            map = L.map('map', { zoomControl: false }).setView([29.8, 108.5], 5.0);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

            const sorted = [...destinations].sort((a,b) => a.order - b.order);
            sorted.forEach(d => {
                const icon = L.divIcon({
                    html: `<span>${d.icone || '📍'}</span>`,
                    className: 'custom-map-marker',
                    iconSize: [50, 50],
                    iconAnchor: [25, 25]
                });
                L.marker([d.lat, d.lng], { icon }).addTo(map).bindTooltip(d.city);
            });

            if(sorted.length > 1) {
                const pts = sorted.map(d => [d.lat, d.lng]);
                L.polyline(pts, { color: '#b89464', weight: 2, opacity: 0.5, dashArray: '5, 10' }).addTo(map);
            }
        }

        function load() {
            onValue(ref(db, 'destinations'), (snap) => {
                if(snap.exists()) {
                    destinations = Object.values(snap.val()).map(d => ({ ...defaultDests.find(x => x.id === d.id), ...d }));
                } else {
                    destinations = JSON.parse(JSON.stringify(defaultDests));
                }
                render();
                initMap();
            });
        }

        function render() {
            const cont = document.getElementById('destContainer');
            cont.innerHTML = '';
            destinations.sort((a,b) => a.order - b.order).forEach((d, i) => {
                const card = document.createElement('div');
                card.className = 'destination-card';
                card.style.animationDelay = (i*0.1) + 's';
                
                const acts = (d.activities || []).map((a, idx) => `<span class="activity-tag">${a}<button onclick="removeAct('${d.id}', ${idx})">×</button></span>`).join('');
                const trans = ['Train', 'Avion', 'Bus'].map(t => `<button class="transport-btn ${d.transport === t ? 'active' : ''}" onclick="upTrans('${d.id}', '${t}')">${t}</button>`).join('');

                card.innerHTML = `
                    <div class="destination-image"><img src="${d.image}"></div>
                    <div class="destination-content">
                        <div class="destination-number">${i+1}</div>
                        <h3>${d.city}</h3>
                        <div class="days-input"><input type="number" value="${d.days}" onchange="upDays('${d.id}', this.value)"> jours</div>
                        <div style="margin-bottom:1rem;">${trans}</div>
                        <div class="activity-list">${acts}</div>
                        <div style="display:flex;"><input type="text" class="add-input" id="in-${d.id}"><button class="add-btn" onclick="addAct('${d.id}')">+</button></div>
                        <div class="divider"></div>
                    </div>
                `;
                cont.appendChild(card);
            });
            document.getElementById('totalDays').textContent = destinations.reduce((s, d) => s + d.days, 0);
        }

        window.upDays = (id, v) => { set(ref(db, `destinations/${id}/days`), parseInt(v)); };
        window.upTrans = (id, t) => { set(ref(db, `destinations/${id}/transport`), t); };
        window.addAct = (id) => {
            const v = document.getElementById(`in-${id}`).value;
            if(!v) return;
            const d = destinations.find(x => x.id === id);
            const a = [...(d.activities || []), v];
            set(ref(db, `destinations/${id}/activities`), a);
        };
        window.removeAct = (id, idx) => {
            const d = destinations.find(x => x.id === id);
            const a = [...d.activities]; a.splice(idx, 1);
            set(ref(db, `destinations/${id}/activities`), a);
        };

        load();
    </script>
</body>
</html>
