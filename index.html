<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINAAAA - Itinéraire & Budget Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        :root {
            --bg-deep: #0f1115;
            --bg-card: #1a1d23;
            --gold: #b89464;
            --gold-light: #d4cdc0;
            --red-imperial: #a62c2b;
            --text-main: #d1d1d1;
            --text-muted: #888;
            --link-blue: #4A7C7E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }

        /* --- LANTERNES --- */
        .lantern-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .lantern {
            position: absolute;
            background: rgba(166, 44, 43, 0.08);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(166, 44, 43, 0.1);
            animation: floatUp 30s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(15deg); opacity: 0; }
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1100;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(184, 148, 100, 0.2);
            padding: 1.2rem 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 1.6rem;
            color: var(--red-imperial);
            letter-spacing: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .header-info {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* --- HERO --- */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(15, 17, 21, 0.2), rgba(15, 17, 21, 0.8)), url('https://i.ibb.co/p6RjypTH/jennifer-chen-Pnc2-Uxb7-PG0-unsplash.jpg') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-top: 60px;
            position: relative;
            z-index: 1;
        }

        .hero-content h2 {
            font-size: 5.5rem;
            color: var(--red-imperial);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            letter-spacing: 12px;
            font-weight: 700;
        }

        /* --- MAP SECTION --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }

        .map-wrapper {
            background: var(--bg-card);
            padding: 1rem;
            margin: -60px 0 4rem;
            border-radius: 2rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(184, 148, 100, 0.15);
            position: relative;
        }

        #map {
            width: 100%;
            height: 600px;
            border-radius: 1.5rem;
            background: #111;
        }

        .custom-map-marker {
            display: flex !important;
            align-items: center;
            justify-content: center;
            background: rgba(15, 17, 21, 0.85) !important;
            backdrop-filter: blur(4px);
            border: 2px solid var(--gold) !important;
            border-radius: 50% !important;
            box-shadow: 0 0 15px rgba(184, 148, 100, 0.4);
            width: 50px !important;
            height: 50px !important;
        }

        .custom-map-marker span { font-size: 24px; }

        .legende {
            position: absolute;
            bottom: 25px;
            left: 25px;
            background: rgba(15, 17, 21, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(184, 148, 100, 0.3);
            display: flex;
            gap: 15px;
            font-size: 0.75rem;
            color: var(--gold-light);
            z-index: 1000;
        }

        /* --- DESTINATIONS --- */
        .section-title h2 {
            text-align: center;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 3rem;
            letter-spacing: 2px;
        }

        .destinations {
            display: grid;
            gap: 4rem;
            padding-bottom: 5rem;
        }

        .destination-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 2rem;
            border: 1px solid rgba(184, 148, 100, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            align-items: start;
        }

        .destination-card:nth-child(even) { direction: rtl; }
        .destination-card > * { direction: ltr; }

        .destination-image {
            width: 100%;
            height: 450px;
            border-radius: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 100px;
        }

        .destination-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .destination-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 1.5rem;
        }

        .destination-number {
            width: 50px;
            height: 50px;
            background: var(--red-imperial);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(166, 44, 43, 0.4);
        }

        .destination-content h3 {
            font-size: 2.5rem;
            color: var(--gold);
        }

        .days-input {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 8px 15px;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            color: var(--gold);
            font-weight: 600;
        }

        .days-input input {
            width: 45px;
            background: transparent;
            border: none;
            color: var(--red-imperial);
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
        }

        .input-label {
            display: block;
            font-size: 0.8rem;
            color: var(--red-imperial);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .transport-btn {
            padding: 8px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(184, 148, 100, 0.15);
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            margin: 0 6px 6px 0;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .transport-btn.active {
            background: var(--gold);
            color: var(--bg-deep);
            border-color: var(--gold);
            font-weight: 600;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(184, 148, 100, 0.1);
        }

        .item-main {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .item-main a {
            color: var(--link-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .price-badge {
            background: rgba(184, 148, 100, 0.15);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .remove-item {
            color: var(--red-imperial);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 10px;
        }

        .add-group {
            display: grid;
            grid-template-columns: 1fr 80px 45px;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .add-group input {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(184, 148, 100, 0.2);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .add-group button {
            background: var(--gold);
            color: var(--bg-deep);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .budget-summary {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(184, 148, 100, 0.1);
            text-align: right;
            color: var(--gold);
            font-weight: 700;
            font-size: 0.9rem;
        }

        footer {
            background: #080a0d;
            padding: 4rem;
            text-align: center;
            border-top: 1px solid rgba(184, 148, 100, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 992px) {
            .destination-card { grid-template-columns: 1fr; }
            .destination-image { height: 300px; position: relative; top: 0; }
        }
    </style>
</head>
<body>
    <div class="lantern-bg" id="lanterns"></div>

    <header>
        <div class="header-content">
            <h1>CHINAAAA</h1>
            <div class="header-info">
                <span><span id="totalDays">0</span> JOURS</span>
                <span>BUDGET: <span id="totalBudget">0</span>€</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>CHINAAAA</h2>
        </div>
    </section>

    <div class="container">
        <div class="map-wrapper">
            <div id="map"></div>
            <div class="legende">
                <span>🏙️ Shanghai</span>
                <span>🏔️ Zhangjiajie</span>
                <span>🌸 Furong</span>
                <span>🌉 Chongqing</span>
                <span>🐼 Chengdu</span>
            </div>
        </div>

        <section class="section-title">
            <h2>L'Épopée Orientale</h2>
        </section>

        <div class="destinations" id="destContainer"></div>
    </div>

    <footer>
        <p style="color: var(--gold); letter-spacing: 2px;">🏮 BON VOYAGE 🏮</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

        // Lanterns
        const lContainer = document.getElementById('lanterns');
        for(let i=0; i<15; i++) {
            const l = document.createElement('div');
            l.className = 'lantern';
            l.style.left = Math.random()*100 + '%';
            l.style.width = (Math.random()*15 + 20) + 'px';
            l.style.height = (parseFloat(l.style.width)*1.4) + 'px';
            l.style.animationDelay = Math.random()*20 + 's';
            l.style.animationDuration = (Math.random()*15 + 25) + 's';
            lContainer.appendChild(l);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyA9HSsYr_LCyAEpZS4zY9i69zQaG2zXNbw",
            authDomain: "chinaaaaa.firebaseapp.com",
            databaseURL: "https://chinaaaaa-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chinaaaaa",
            storageBucket: "chinaaaaa.firebasestorage.app",
            messagingSenderId: "663888608273",
            appId: "1:663888608273:web:3720af2baa1120673cc5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultDests = [
            { id: 'shanghai-1', city: 'Shanghai', days: 6, order: 1, image: 'https://i.ibb.co/TfCJSnJ/freeman-zhou-o-V9hp8w-Xk-PE-unsplash.jpg', lat: 31.2304, lng: 121.4737, activities: [], links: [], transport: 'Avion', icone: '🏙️' },
            { id: 'zhangjiajie', city: 'Zhangjiajie', days: 4, order: 2, image: 'https://i.ibb.co/G35bBvKc/alexander-schimmeck-ZOu-Iaoca-NDA-unsplash.jpg', lat: 29.3996, lng: 110.4848, activities: [], links: [], transport: 'Train', icone: '🏔️' },
            { id: 'furong', city: 'Furong', days: 1, order: 3, image: 'https://i.ibb.co/d4XXQhRJ/tao-yuan-7ak-Moq-Qk-AO0-unsplash.jpg', lat: 28.8433, lng: 109.9338, activities: [], links: [], transport: 'Bus', icone: '🌸' },
            { id: 'chongqing', city: 'Chongqing', days: 4, order: 4, image: 'https://i.ibb.co/h12tnHRY/cling-yong-g-LNV8i-VCF9g-unsplash.jpg', lat: 29.5630, lng: 106.5516, activities: [], links: [], transport: 'Train', icone: '🌉' },
            { id: 'chengdu', city: 'Chengdu', days: 2, order: 5, image: 'https://i.ibb.co/NgpRQVdx/emma-lau-STSKtlrzz-YM-unsplash.jpg', lat: 30.5728, lng: 104.0668, activities: [], links: [], transport: 'Train', icone: '🐼' },
            { id: 'shanghai-2', city: 'Shanghai', days: 6, order: 6, image: 'https://i.ibb.co/TfCJSnJ/freeman-zhou-o-V9hp8w-Xk-PE-unsplash.jpg', lat: 31.2304, lng: 121.4737, activities: [], links: [], transport: 'Avion', icone: '🏙️' }
        ];

        let destinations = [];
        let map = null;

        function initMap() {
            if (map) map.remove();
            map = L.map('map', { zoomControl: false }).setView([29.8, 108.5], 5.0);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

            const sorted = [...destinations].sort((a,b) => a.order - b.order);
            sorted.forEach(d => {
                const icon = L.divIcon({
                    html: `<span>${d.icone || '📍'}</span>`,
                    className: 'custom-map-marker',
                    iconSize: [50, 50],
                    iconAnchor: [25, 25]
                });
                L.marker([d.lat, d.lng], { icon }).addTo(map).bindTooltip(d.city);
            });

            if(sorted.length > 1) {
                const pts = sorted.map(d => [d.lat, d.lng]);
                L.polyline(pts, { color: '#b89464', weight: 2, opacity: 0.4, dashArray: '5, 10' }).addTo(map);
            }
        }

        function load() {
            onValue(ref(db, 'destinations'), (snap) => {
                if(snap.exists()) {
                    destinations = Object.values(snap.val()).map(d => ({ ...defaultDests.find(x => x.id === d.id), ...d }));
                } else {
                    destinations = JSON.parse(JSON.stringify(defaultDests));
                }
                render();
                initMap();
            });
        }

        function getDomain(url) {
            try { return new URL(url).hostname.replace('www.', ''); } catch(e) { return 'Lien'; }
        }

        function render() {
            const cont = document.getElementById('destContainer');
            cont.innerHTML = '';
            let globalBudget = 0;

            destinations.sort((a,b) => a.order - b.order).forEach((d, i) => {
                const card = document.createElement('div');
                card.className = 'destination-card';
                card.style.animationDelay = (i*0.1) + 's';
                
                let cityBudget = 0;

                const actsHtml = (d.activities || []).map((a, idx) => {
                    cityBudget += (a.price || 0);
                    return `
                    <div class="item-row">
                        <div class="item-main"><span>📍 ${a.name}</span></div>
                        <div style="display:flex; align-items:center;">
                            ${a.price ? `<span class="price-badge">${a.price}€</span>` : ''}
                            <button class="remove-item" onclick="removeItem('${d.id}', 'activities', ${idx})">×</button>
                        </div>
                    </div>`;
                }).join('');

                const linksHtml = (d.links || []).map((l, idx) => {
                    cityBudget += (l.price || 0);
                    return `
                    <div class="item-row">
                        <div class="item-main"><a href="${l.url}" target="_blank">🔗 ${getDomain(l.url)}</a></div>
                        <div style="display:flex; align-items:center;">
                            ${l.price ? `<span class="price-badge">${l.price}€</span>` : ''}
                            <button class="remove-item" onclick="removeItem('${d.id}', 'links', ${idx})">×</button>
                        </div>
                    </div>`;
                }).join('');

                globalBudget += cityBudget;

                const trans = ['Train', 'Avion', 'Bus'].map(t => `<button class="transport-btn ${d.transport === t ? 'active' : ''}" onclick="upTrans('${d.id}', '${t}')">${t}</button>`).join('');

                card.innerHTML = `
                    <div class="destination-image"><img src="${d.image}"></div>
                    <div class="destination-content">
                        <div class="destination-header">
                            <div class="destination-number">${i+1}</div>
                            <h3>${d.city}</h3>
                        </div>
                        <div class="days-input"><input type="number" value="${d.days}" onchange="upDays('${d.id}', this.value)"> jours</div>
                        
                        <div style="margin-bottom:2rem;">
                            <span class="input-label">Transport</span>
                            <div>${trans}</div>
                        </div>

                        <div style="margin-bottom:2rem;">
                            <span class="input-label">Activités</span>
                            <div class="item-list">${actsHtml}</div>
                            <div class="add-group">
                                <input type="text" placeholder="Nom..." id="act-n-${d.id}">
                                <input type="number" placeholder="€" id="act-p-${d.id}">
                                <button onclick="addItem('${d.id}', 'activities')">+</button>
                            </div>
                        </div>

                        <div style="margin-bottom:1rem;">
                            <span class="input-label">Liens & Réservations</span>
                            <div class="item-list">${linksHtml}</div>
                            <div class="add-group">
                                <input type="url" placeholder="Lien..." id="lnk-u-${d.id}">
                                <input type="number" placeholder="€" id="lnk-p-${d.id}">
                                <button onclick="addItem('${d.id}', 'links')">+</button>
                            </div>
                        </div>

                        <div class="budget-summary">Budget ${d.city}: ${cityBudget}€</div>
                        <div class="divider"></div>
                    </div>
                `;
                cont.appendChild(card);
            });
            document.getElementById('totalDays').textContent = destinations.reduce((s, d) => s + d.days, 0);
            document.getElementById('totalBudget').textContent = globalBudget;
        }

        window.upDays = (id, v) => { set(ref(db, `destinations/${id}/days`), parseInt(v)); };
        window.upTrans = (id, t) => { set(ref(db, `destinations/${id}/transport`), t); };
        
        window.addItem = (id, type) => {
            const nameIn = document.getElementById(type === 'activities' ? `act-n-${id}` : `lnk-u-${id}`);
            const priceIn = document.getElementById(type === 'activities' ? `act-p-${id}` : `lnk-p-${id}`);
            const nameVal = nameIn.value.trim();
            const priceVal = parseFloat(priceIn.value) || 0;

            if(!nameVal) return;

            const d = destinations.find(x => x.id === id);
            const list = [...(d[type] || [])];
            
            if(type === 'activities') list.push({ name: nameVal, price: priceVal });
            else list.push({ url: nameVal, price: priceVal });

            set(ref(db, `destinations/${id}/${type}`), list);
            nameIn.value = ''; priceIn.value = '';
        };

        window.removeItem = (id, type, idx) => {
            const d = destinations.find(x => x.id === id);
            const list = [...d[type]];
            list.splice(idx, 1);
            set(ref(db, `destinations/${id}/${type}`), list);
        };

        load();
    </script>
</body>
</html>
